<!DOCTYPE html>
<html lang="en">
<head>
  <title>Angry Birds China (English)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="full-screen" content="true" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />
  <meta name="laya" screenorientation="landscape" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="text/javascript">
    window.screenOrientation = "sensor_landscape";
    function loadLib(url) {
      document.write('<script type="text/javascript" src="' + url + '"><\/script>');
    }
  </script>

  <!-- WeChat hook shim + English dictionary, before the game bundle -->
  <script type="text/javascript" src="platform-shim.js?v=276c5e17"></script>
  <script type="text/javascript" src="en-assets-list.js?v=f0d2a80e"></script>
  <script type="text/javascript" src="en-assets.js?v=1a52b4c3"></script>

  <!-- LayaAir browser runtimes + game bundle -->
  <script type="text/javascript">
    loadLib("libs/laya.core.js?v=b329d7f0");
    loadLib("libs/laya.ani.js?v=7f3b24f1");
    loadLib("libs/laya.html.js?v=04b98208");
    loadLib("libs/laya.ui.js?v=de92e5eb");
    loadLib("libs/laya.d3.js?v=a8e97ad7");
    loadLib("libs/laya.physics.js?v=afdd8a6d");
    loadLib("physics-fix.js?v=8eaf47ee");   // real-time physics stepping; must run before js/bundle.js
    loadLib("libs/fairygui.js?v=dbcede7e");
    loadLib("libs/rawinflate.min.js?v=c8e373dd");
    loadLib("js/bundle.js?v=cd8467fc");
  </script>

  <!-- Translation hook (patches FairyGUI text) + desktop scaling/audio fixes -->
  <script type="text/javascript" src="translation.js?v=f6ad6c34"></script>
  <script type="text/javascript" src="desktop-fixes.js?v=d8fbda79"></script>
</body>
</html>
